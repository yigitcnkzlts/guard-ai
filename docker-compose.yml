services:
  redis:
    image: redis:7-alpine
    container_name: guard-ai-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: guard-ai-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo-api:
    build:
      context: ./demo-api
    container_name: guard-ai-demo-api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  guard-backend:
    build:
      context: ./backend
    container_name: guard-ai-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${GUARD_DATABASE_URL}
      DEMOSHOP_BASE_URL: ${DEMOSHOP_BASE_URL}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      demo-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GUARD_API_URL: ${NEXT_PUBLIC_GUARD_API_URL:-http://localhost:8001}
    container_name: guard-ai-frontend
    environment:
      NEXT_PUBLIC_GUARD_API_URL: ${NEXT_PUBLIC_GUARD_API_URL:-http://localhost:8001}
    ports:
      - "3001:3000"
    depends_on:
      guard-backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
